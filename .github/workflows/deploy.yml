name: Deploy com Firebase Secrets

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permite rodar manualmente se precisar

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Permissões necessárias para o deploy no GitHub Pages
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout do código
        # Atualize de v4 para v5 (ou a última disponível)
        uses: actions/checkout@v5 

      - name: Configurar Python
        # Atualize de v4 para v5
        uses: actions/setup-python@v5 
        with:
          python-version: '3.x'

      - name: Injetar Firebase Secrets
        run: | 
          python inject_secrets.py
          echo "Verificando se o arquivo foi criado:"
          ls -R
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}

      - name: Deploy para GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          # Garante que arquivos novos criados pelo script Python sejam incluídos
          force_orphan: true
          # ESTA LINHA É A CHAVE:
          exclude_assets: ''