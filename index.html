<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarLog - Gestão de Veículos</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>
  <!-- 
    CABECALHO E NAVEGACAO 
    Mantem-se fixo no topo (sticky) para facilitar a alternancia entre as seções.
  -->
  <nav>
    <div class="brand">
      <div class="logo">CarLog</div>
      <button id="btn-theme-toggle" onclick="toggleTheme()" title="Alternar Tema">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2"></path>
          <path d="M12 20v2"></path>
          <path d="m4.93 4.93 1.41 1.41"></path>
          <path d="m17.66 17.66 1.41 1.41"></path>
          <path d="M2 12h2"></path>
          <path d="M20 12h2"></path>
          <path d="m6.34 17.66-1.41 1.41"></path>
          <path d="m19.07 4.93-1.41 1.41"></path>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
        </svg>
      </button>
    </div>
    <div class="menu">
      <button onclick="showSection('section-veiculos')">Veículos</button>
      <button onclick="showSection('section-registro')">Registros</button>
      <button onclick="showSection('section-lista')">Relatórios</button>
      <div id="auth-container">
        <button id="btn-login" onclick="loginGoogle()">
          <svg width="18" height="18" viewBox="0 0 18 18">
            <path fill="#4285F4"
              d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" />
            <path fill="#34A853"
              d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" />
            <path fill="#FBBC05"
              d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" />
            <path fill="#EA4335"
              d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.582C13.463.891 11.426 0 9 0 5.482 0 2.443 2.043.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z" />
          </svg>
        </button>
        <div id="user-info" style="display: none;">
          <div class="user-dropdown-container">
            <img id="user-photo" src="" alt="Usuário" onclick="toggleUserMenu()" referrerpolicy="no-referrer">
            <div id="user-dropdown" class="dropdown-content">
              <div class="close-dropdown" onclick="toggleUserMenu()">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </div>
              <div id="user-name-display" class="user-name-header"></div>
              <hr>
              <button id="btn-sync" onclick="sincronizarComNuvem(true)">
                <span class="icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                  </svg>
                </span>
                <span id="btn-sync-text">Sincronizar Nuvem</span>
              </button>
              <button id="btn-purge" onclick="purgarRegistrosExcluidos()">
                <span class="icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  </svg>
                </span>
                Limpar Lixeira
              </button>
              <hr>
              <button id="btn-logout" onclick="logout()">
                <span class="icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                  </svg>
                </span>
                Sair da Conta
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <main>
    <!-- 
      SECAO: MEUS VEICULOS
      Exibe a lista de carros/motos cadastrados e permite a adicao de novos.
    -->
    <section id="section-veiculos" style="display:none;">
      <h2>Meus Veículos</h2>
      <!-- Container onde o JS injeta os cards dos veiculos -->
      <div id="lista-veiculos-cards" class="cards-container"></div>

      <input type="file" id="file-import" style="display:none" onchange="importarVeiculoJSON(event)" accept=".json">

      <!-- Formulario para novo veiculo (oculto por padrao) -->
      <form id="form-novo-veiculo" style="display:none; margin-top: 1.5rem;">
        <strong style="color: var(--primary); font-size: 1.1rem;">Adicionar Novo Veículo</strong>
        <input type="text" id="veiculo-nome" placeholder="Ex: Onix 2023 / Honda CB 500" required>
        <input type="text" id="veiculo-placa" placeholder="Placa (opcional)">
        <div class="form-actions">
          <button type="submit" class="btn-save">Adicionar Veículo</button>
          <button type="button" class="btn-cancel" onclick="toggleFormVeiculo()">Cancelar</button>
        </div>
      </form>
    </section>

    <!-- 
      SECAO: REGISTRO DE GASTOS
      Formulario principal para entrada de dados. Funciona tanto para novos registros 
      quanto para edicao de registros existentes.
    -->
    <section id="section-registro" style="display:none;">
      <!-- O span #registro-status recebe a tag "NOVO" ou "EDITANDO" via JS -->
      <h2>Registro de Gasto <span id="registro-status" class="status-badge"></span></h2>
      <form id="form-entrada">
        <!-- Seleção do veículo: desabilitado se houver apenas um ou se for edicao -->
        <div class="form-group">
          <label>Veículo:</label>
          <select id="entrada-veiculo" onchange="buscarUltimoKm()" required></select>
        </div>

        <!-- Grid de informações gerais (Tipo, Data e KM) -->
        <div class="grid-3">
          <div class="form-group">
            <label>Tipo:</label>
            <select id="entrada-tipo" onchange="toggleTipoCampos(); buscarUltimoKm()">
              <option value="abastecimento">Abastecimento</option>
              <option value="manutencao">Manutenção</option>
              <option value="despesa">Despesa</option>
            </select>
          </div>
          <div class="form-group">
            <label>Data:</label>
            <div class="input-container">
              <input type="date" id="entrada-data" onchange="buscarUltimoKm()" required>
              <small id="hint-data" class="field-hint"></small>
            </div>
          </div>
          <div class="form-group">
            <label>KM Atual:</label>
            <div class="input-container">
              <input type="text" id="entrada-km" placeholder="0" inputmode="numeric" oninput="aplicarMascara(this, 0)"
                required>
              <small id="hint-km" class="field-hint"></small>
            </div>
          </div>
        </div>

        <!-- 
          CAMPOS ESPECIFICOS: ABASTECIMENTO 
          Exibidos apenas quando o tipo 'abastecimento' esta selecionado.
        -->
        <div id="campos-abastecimento" class="tipo-especifico">
          <div class="grid-2">
            <div class="input-container">
              <div class="autocomplete-wrapper">
                <input type="text" id="abs-local" placeholder="Posto / Local" autocomplete="off">
                <div id="suggestions-abs-local" class="autocomplete-suggestions" style="display:none;"></div>
              </div>
              <small id="hint-abs-local" class="field-hint"></small>
            </div>
            <div class="input-container">
              <select id="abs-combustivel">
                <option value="" disabled selected>Tipo de Combustível</option>
                <option value="Etanol">Etanol</option>
                <option value="Etanol Aditivado">Etanol Aditivado</option>
                <option value="Gasolina">Gasolina</option>
                <option value="Gasolina Aditivada">Gasolina Aditivada</option>
                <option value="Diesel">Diesel</option>
              </select>
              <small id="hint-abs-combustivel" class="field-hint"></small>
            </div>
          </div>
          <div class="grid-3">
            <div class="input-container">
              <input type="text" id="abs-litros" placeholder="Litros" inputmode="numeric"
                oninput="aplicarMascara(this, 3); calcAbastecimento('litros')">
              <small id="hint-abs-litros" class="field-hint"></small>
            </div>
            <div class="input-container">
              <input type="text" id="abs-preco-litro" placeholder="Preço por Litro" inputmode="numeric"
                oninput="aplicarMascara(this, 2); calcAbastecimento('preco')">
              <small id="hint-abs-preco-litro" class="field-hint"></small>
            </div>
            <div class="input-container">
              <input type="text" id="abs-total" placeholder="Preço Total" inputmode="numeric"
                oninput="aplicarMascara(this, 2); calcAbastecimento('total')">
              <small id="hint-abs-total" class="field-hint"></small>
            </div>
          </div>
        </div>

        <!-- 
          CAMPOS ESPECIFICOS: MANUTENCAO 
          Exibidos apenas quando o tipo 'manutencao' esta selecionado.
        -->
        <div id="campos-manutencao" class="tipo-especifico" style="display:none;">
          <div class="autocomplete-wrapper">
            <input type="text" id="man-local" placeholder="Oficina / Loja" autocomplete="off">
            <div id="suggestions-man-local" class="autocomplete-suggestions" style="display:none;"></div>
          </div>
          <div class="grid-2">
            <input type="text" id="man-pecas" placeholder="Valor Peças" inputmode="numeric"
              oninput="aplicarMascara(this, 2)">
            <input type="text" id="man-mao-obra" placeholder="Mão de Obra" inputmode="numeric"
              oninput="aplicarMascara(this, 2)">
          </div>
        </div>

        <!-- 
          CAMPOS ESPECIFICOS: DESPESAS 
          Exibidos apenas quando o tipo 'despesa' esta selecionado.
        -->
        <div id="campos-despesa" class="tipo-especifico" style="display:none;">
          <input type="text" id="imp-nome" placeholder="Nome da Despesa (IPVA, Licenciamento, Multa)">
          <div class="grid-2">
            <input type="text" id="imp-valor" placeholder="Valor" inputmode="numeric" oninput="aplicarMascara(this, 2)">
            <input type="date" id="imp-referencia" title="Data de Referência">
          </div>
        </div>

        <textarea id="entrada-obs" placeholder="Observações adicionais..."></textarea>

        <div class="form-actions">
          <button type="submit" class="btn-save">Salvar</button>
          <button type="button" class="btn-cancel" onclick="cancelEdit()">Cancelar</button>
        </div>
      </form>
    </section>

    <!-- 
      SECAO: RELATORIOS (HISTORICO)
      Exibe todos os registros salvos com capacidades de filtragem por veiculo e tipo.
    -->
    <section id="section-lista" style="display:none;">
      <h2>Histórico de Gastos</h2>

      <!-- Controles de filtragem -->
      <div class="filtros">
        <select id="filtro-veiculo" onchange="inicializarDatasFiltro(); renderizarLista()">
          <option value="">Todos os Veículos</option>
        </select>
        <!-- Toggle buttons para filtro rapido por categoria -->
        <div class="toggle-filtros">
          <button class="filtro-btn active" data-tipo="abastecimento" onclick="toggleFiltro(this)">⛽
            Abastecimento</button>
          <button class="filtro-btn active" data-tipo="manutencao" onclick="toggleFiltro(this)">🔧 Manutenção</button>
          <button class="filtro-btn active" data-tipo="despesa" onclick="toggleFiltro(this)">📜 Despesa</button>
          <button class="filtro-btn" data-tipo="excluido" onclick="toggleFiltro(this)">🗑️ Lixeira</button>
        </div>
        <div class="filtro-datas">
          <input type="date" id="filtro-data-inicio" onchange="renderizarLista()" title="Data Inicial">
          <span>até</span>
          <input type="date" id="filtro-data-fim" onchange="renderizarLista()" title="Data Final">
          <button type="button" onclick="resetarFiltros()">Limpar</button>
        </div>
      </div>
      <!-- Container onde o JS injeta os cards expansíveis do historico -->
      <div id="lista-entradas-container" class="lista-entradas">
        <!-- Preenchido via JS -->
      </div>
    </section>
  </main>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>

</html>
